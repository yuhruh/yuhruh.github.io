# Featured projects, newest first. `featured: true` shows the large card; others are listed compactly.
# Bullets and numbers mirror the résumé.
- name: Household Tracker
  year: 2026.10 — Present
  featured: true
  image: /assets/images/householdLogo.png
  video: /assets/videos/household-intro.mp4
  poster: /assets/images/household-intro-poster.jpg
  video_label: A 100-second walkthrough of Household Tracker on a phone
  live: https://household-tracker.up.railway.app
  source: https://github.com/yuhruh/HouseHold_Notification
  ci_badge: https://github.com/yuhruh/HouseHold_Notification/actions/workflows/ci.yml/badge.svg
  ci_url: https://github.com/yuhruh/HouseHold_Notification/actions/workflows/ci.yml
  docs:
    - label: Design decisions (6 ADRs)
      url: https://github.com/yuhruh/HouseHold_Notification/tree/main/docs/adr
  summary: >-
    A shared bill tracker (PWA) in zh-TW and English that replaced my family's Google Sheet.
  metrics:
    - In daily use
    - ~365 tests
    - zh-TW / EN
  points:
    - lead: Sheet to product
      text: Shared ledgers with one-step bill entry by scanning a Taiwan bill's barcode, recurring bills that never duplicate, expense charts, and a preview-then-commit CSV import that is safe to re-run.
    - lead: Reliable reminders
      text: One daily digest per member in their own time zone, by Web Push, email and in-app inbox. Unique indexes act as locks so a double run never sends twice, and push counts as delivered only after the device confirms it.
    - lead: Operations and testing
      text: Encrypted weekly database backups plus a Google Drive backup. Brakeman, RuboCop and dependency audits run in GitHub Actions.
  stack: [Rails 8.1, PostgreSQL, Hotwire, Web Push, Tailwind CSS, Solid Queue, Apache ECharts, Sentry, Railway]

- name: Pet Tracker
  year: 2025.02 — Present
  featured: true
  image: /assets/images/ajiLogo.png
  video: /assets/videos/pet-tracker-intro.mp4
  poster: /assets/images/pet-tracker-intro-poster.jpg
  video_label: An 85-second walkthrough of Pet Tracker on a phone
  live: https://pet-feeding-tracker-v4.up.railway.app
  source: https://github.com/yuhruh/Pet_Feeding_Tracker_v4
  ci_badge: https://github.com/yuhruh/Pet_Feeding_Tracker_v4/actions/workflows/ci.yml/badge.svg
  ci_url: https://github.com/yuhruh/Pet_Feeding_Tracker_v4/actions/workflows/ci.yml
  docs:
    - label: Architecture
      url: https://github.com/yuhruh/Pet_Feeding_Tracker_v4/blob/main/ARCHITECTURE.md
  summary: >-
    A Rails 8 pet-care app for households, on web, PWA and Android.
  metrics:
    - In daily use
    - ~570 tests (56 browser)
    - Web · PWA · Android
  points:
    - lead: Collaboration
      text: Owners invite caregivers and share read-only links, with one role policy behind every permission. One-tap care logs appear live on everyone's page via Turbo Streams.
    - lead: Price scraping
      text: Monthly Nokogiri scraper across two Taiwan shopping sites (BigGo HTML, PChome JSON API), ranking listings by NT$ per kg. Selectors survive hashed class names that change on redeploy; a changed layout is told apart from "no results" and raises an alert; requests are rate-limited and follow robots.txt; tested against saved HTML fixtures.
    - lead: Background work
      text: Care reminders at each household's local time, with fallback from Android push to LINE to email.
    - lead: Unstructured to structured
      text: Gemini vision turns varied health-checkup photos into validated ActiveRecord records.
    - lead: Testing and CI
      text: Minitest suite with browser tests, plus Brakeman, RuboCop and dependency audits in CI.
  stack: [Rails 8.1, PostgreSQL, Hotwire, Hotwire Native (Kotlin), Tailwind CSS, Solid Queue, Nokogiri, Gemini, Railway]

