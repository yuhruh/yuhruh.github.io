<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- if page.title %}
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    {%- else %}
    <title>{{ site.title | escape }} · {{ site.role | escape }}</title>
    {%- endif %}
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ site.description | strip | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/about.jpg' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {%- feed_meta %}
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-prompt">~/</span>rita-huang</a>
        <nav class="nav" aria-label="Sections">
          <a href="{{ '/#what-i-do' | relative_url }}">what&nbsp;i&nbsp;do</a>
          <a href="{{ '/#projects' | relative_url }}">projects</a>
          <a href="{{ '/#open-source' | relative_url }}">open&nbsp;source</a>
          <a href="{{ '/#about' | relative_url }}">about</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      {{ content }}
    </main>

    {%- include footer.html -%}
  </body>
</html>
